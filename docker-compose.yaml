services:
  ai-code-review:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-code-review
    restart: unless-stopped

    env_file:
      - .env.docker

    volumes:
      - ./private-key.pem:/app/private-key.pem:ro

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8080/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: ai-code-review-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      ai-code-review:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config: